name: 'AI: PR-Agent review'

on:
  pull_request:
    types: [ opened, reopened, ready_for_review ]
  issue_comment:
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]

permissions:
  contents: read

jobs:
  pr-agent:
    name: 'PR-Agent'
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      models: read
      pull-requests: write
    steps:
      - name: Run PR-Agent
        uses: The-PR-Agent/pr-agent@8e5a9295973b24af4b70cafd0b660a230811ef9e # v0.47.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI__API_BASE: 'https://models.github.ai/inference'
          OPENAI__KEY: ${{ secrets.GITHUB_TOKEN }}
          CONFIG__MODEL: 'openai/openai/gpt-4o'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: '128000'
